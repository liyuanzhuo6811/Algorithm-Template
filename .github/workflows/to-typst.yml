on:
  workflow_dispatch:

name: Make Typst
jobs:
  topdf:
    name: Make Typst
    runs-on: ubuntu-latest
    steps:
    # - name: Checkout
    #   uses: actions/checkout@v5
    #   with:
    #     token: ${{ secrets.ACCESS_TOKEN }}
    #     ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # 安装 Rust（用于通过 cargo 安装 typst CLI）
    # - name: Set up Rust toolchain
    #   uses: actions-rs/toolchain@v1
    #   with:
    #     toolchain: stable
    #     profile: minimal
    #     override: true

    # - name: Install typst CLI
    #   run: |
    #     cargo install typst || true

    - name: Install typst CLI
      run: |
        sudo apt update
        sudo apt install snapd
        sudo snap install typst

    - name: Make Typst PDF
      run: |
        pip install requests
        python work/get_contribute.py
        # 生成 typst 源的脚本（请确保存在或改为你的脚本名）
        python work/maketypst.py
        cd work/typst
        # 编译 typst 文件为 PDF（假设源为 all.typ，输出 all-pdf.pdf）
        typst compile all.typ all-pdf.pdf
        cd ../../

